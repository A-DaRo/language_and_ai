# conf/laptop/pipeline.yaml - Laptop-specific overrides
# Optimized for consumer GPUs (4-16GB VRAM) and development workflows

defaults:
  - /base/pipeline

# ---------------------------------------------------------------------------
# Laptop Execution Settings
# ---------------------------------------------------------------------------
# Conservative settings for limited VRAM and development/debugging.
# Most advanced optimizations disabled to reduce complexity and memory usage.
# ---------------------------------------------------------------------------
execution:  # ---------------------------------------------------------------------------
  # Self-Optimizing Runtime (Autotuning)
  # ---------------------------------------------------------------------------
  # Adaptive token-budget batching with feedback loop.
  # Conservative settings for laptop GPUs (8-16GB VRAM).
  # ---------------------------------------------------------------------------
  autotuning:
    enabled: true
    warmup_batches: 10             # Batches before adjusting budget
    initial_token_budget: 8192     # Conservative start (~64 * 128 tokens)
    min_token_budget: 2048         # Minimum budget (safety floor)
    max_token_budget: 65536        # Max budget for 8-16GB VRAM
    memory_headroom_mb: 1024       # Keep 1GB free for safety
    scale_up_factor: 1.15          # 15% increase (cautious scaling)
    scale_down_factor: 0.80        # 20% decrease when throttling
    oom_slash_factor: 0.4          # 60% reduction after OOM (aggressive)
    stability_threshold: 0.15      # 15% variance = stable (more tolerant)
    history_window: 8              # Smaller window for faster response
    recovery_patience: 3           # Quick recovery on laptop
  # CUDA graphs: DISABLED for laptop (limited VRAM, dynamic shapes during dev)
  enable_cuda_graphs: false
  cuda_graph_warmup: 3
  cuda_graph_cache_size: 8
  
  # torch.compile: DISABLED by default (slow compilation, debugging harder)
  # Enable for benchmarking: set enable_torch_compile to true
  enable_torch_compile: false
  torch_compile_mode: "reduce-overhead"
  torch_compile_fullgraph: false  # Allow graph breaks for flexibility
  torch_compile_dynamic: true     # Dynamic shapes for flexibility
  torch_compile_backend: "inductor"
  
  # Sequence packing: disabled (adds complexity, marginal gains on small batches)
  sequence_packing:
    enabled: false
    max_packed_length: 1024     # Conservative limit for laptop VRAM
    min_sequences_to_pack: 3
    use_block_diagonal_mask: true
    pack_by_similarity: true
  
  # Async prefetch: disabled (use threading if enabled, not multiprocessing)
  # Threading has lower overhead for small workloads
  async_prefetch:
    enabled: true
    queue_size: 8
    num_workers: 4
    timeout_seconds: 30.0
    prefetch_factor: 2
    use_multiprocessing: false  # Use threading on laptop
    pin_memory: true
    profile_aware: true
  
  # GPU span filtering: enabled (lightweight, always beneficial)
  gpu_span_filter:
    enabled: true
    max_spans_per_sequence: 100
    use_topk: false
    topk_k: 50
  
  numa_pinning: false

dataloader:
  batch_size: 32
  num_workers: 4
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true

precision:
  dtype: "float16"
  use_grad_scaler: true

gliner:
  batch_size: 32
  device: "auto"
  
  # ---------------------------------------------------------------------------
  # Bi-Encoder & Word-Limit (Laptop Overrides)
  # ---------------------------------------------------------------------------
  # Laptop mode: bi-encoder NOT required by default (allows uni-encoder models).
  # Word limit same as base (512 words is GLiNER's default processor limit).
  # ---------------------------------------------------------------------------
  require_bi_encoder: true   # Enforce bi-encoder usage on laptop
  # gliner_max_words: inherited from base (512)
  # tokens_per_word_ratio: inherited from base (1.3)
  
  # ---------------------------------------------------------------------------
  # Laptop-optimized Batch Inference Settings
  # ---------------------------------------------------------------------------
  # Conservative settings for limited VRAM environments.
  # Auto bucket count will typically resolve to 5-8 for laptop GPUs.
  # ---------------------------------------------------------------------------
  batch_inference:
    enable_batching: true
    # null = auto-compute from VRAM (typically 5-8 buckets for laptop)
    # Override to 5 if experiencing OOM errors
    num_buckets: null
    min_bucket_size: 4
    enable_prompt_caching: true
    strict_padding: false      # Disabled for laptop (reduces padding overhead)
  
  chunking:
    mode: "single_sentence"
    legacy_sequential_mode: false

subset:
  enabled: false
  size: 10000

# LEACE configuration for laptop mode
# Note: Strict CPU enforcement for numerical stability and VRAM management
leace:
  device: "cpu"              # Strict CPU for stability
  force_cpu: true            # Explicit override - embeddings moved to CPU for LEACE
  regularization: 1e-5
  batch_size: 50
  compute_dtype: "float64"   # CPU uses higher precision for numerical stability

# Encoder output device configuration
encoder:
  output_device: "cpu"       # Move embeddings to CPU after extraction (for LEACE)

logging:
  level: "DEBUG"
  wandb_enabled: false
