# conf/laptop/pipeline.yaml - Laptop-specific overrides

defaults:
  - /base/pipeline

execution:
  enable_cuda_graphs: false
  enable_torch_compile: false
  numa_pinning: false

dataloader:
  batch_size: 16
  num_workers: 2
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true

precision:
  dtype: "float16"
  use_grad_scaler: true

gliner:
  batch_size: 16
  device: "auto"

subset:
  enabled: true
  size: 10000

# LEACE configuration for laptop mode
# Note: Strict CPU enforcement for numerical stability and VRAM management
leace:
  device: "cpu"              # Strict CPU for stability
  force_cpu: true            # Explicit override - embeddings moved to CPU for LEACE
  regularization: 1e-5
  batch_size: 50
  compute_dtype: "float64"   # CPU uses higher precision for numerical stability

# Encoder output device configuration
encoder:
  output_device: "cpu"       # Move embeddings to CPU after extraction (for LEACE)

logging:
  level: "DEBUG"
  wandb_enabled: false
