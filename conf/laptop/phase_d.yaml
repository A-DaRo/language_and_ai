# Phase D Training Configuration (Laptop Overrides)

# Laptop-specific overrides for smaller-scale training

training:
  num_epochs: 2  # Shorter for testing
  batch_size: 4  # Smaller batch for laptop
  max_steps: null  # Run full epochs even on laptop
  precision: "fp32"

execution:
  bucketing:
    enabled: false
    batch_size: 4
    mega_batch_mult: 50
    shuffle: true
    drop_last: false
    seed: 42
    length_column: "text_length"
    length_scale: 1.0
  dynamic_batching:
    enabled: false
    max_batch_size: 8
    min_batch_size: 1
    drop_last: false
    shuffle: true
    seed: 42
    length_column: "text_length"
    length_scale: 1.0
  telemetry:
    enabled: false
    sample_every: 50
    synchronize: false
  data_loader:
    num_workers: 0
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 2
