# Quick test configuration for pipeline validation
# ==============================================================================
# Minimal training run to verify AOT pipeline works end-to-end
# ==============================================================================

training:
  num_epochs: 1
  max_steps: 5  # Very quick test
  batch_size: 2  # Small batch
  precision: "fp32"  # No mixed precision for stability

optimization:
  use_aot_mode: true
  use_torch_compile: false  # Skip compile for quick test
  use_fused_optimizer: false
  use_device_prefetch: false
  quantize_step: 16
  token_budget: 2048  # Very small budget

execution:
  autotuning:
    enabled: false
  dynamic_batching:
    enabled: true
    max_batch_size: 8
    min_batch_size: 1
  data_loader:
    num_workers: 0  # Single process for quick test
    pin_memory: false

evaluation:
  eval_on_test: false  # Skip test eval for quick test
  write_report: false
