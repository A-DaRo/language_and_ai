# Phase D Verification Configuration (Base)

model:
  name: "roberta-base"
  max_length: 512
  taxonomy_path: "conf/base/gliner_taxonomy.yaml"

verify:
  batch_size: 8
  chg:
    epochs: 10
    learning_rate: 0.001
    regularization: 0.01
    facilitating_threshold: 0.7
    irrelevant_threshold: 0.3
  svs:
    max_batches: 20
    query_strategy: "mean_tokens"
    pos_backend: "hf"
    use_pos: true
    spacy_model: "en_core_web_sm"
    spacy_use_gpu: false
    spacy_gpu_id: 0
    spacy_batch_size: 32
    spacy_n_process: 2
    spacy_disable:
      - "ner"
      - "parser"
    hf_model: "vblagoje/bert-english-uncased-finetuned-pos"
    hf_device: -1
    hf_batch_size: 16
