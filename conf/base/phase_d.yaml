# Phase D Training Configuration (Base)

phase_d:
  experiment_name: "phase_d_baseline"
  seed: 1337

# Model configuration
model:
  name: "roberta-base"
  max_length: 512
  taxonomy_path: "conf/base/gliner_taxonomy.yaml"

# Data configuration
data:
  # Will be overridden by CLI args
  dataset_path: "artifacts/data/output/clean_dataset.arrow"
  artifacts_dir: "artifacts/data/output"

  # Split configuration
  use_split_column: true  # Use existing 'split' column if present
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  split_seed: 42

  # Demographic label fields (from SOBR schema)
  label_fields:
    - female
    - birth_year
    - nationality
    - political_leaning
    - extrovert
    - sensing
    - feeling
    - judging

# Training configuration
training:
  num_epochs: 3
  batch_size: 8
  learning_rate: 2e-5
  layerwise_lr_decay: 0.95
  gradient_accumulation_steps: 1
  precision: "fp32"
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 0.0
    metric: "f1_macro"

  # For testing/debugging
  max_steps: null  # null means run full epochs

  # Checkpointing
  save_every_steps: null
  save_every_epochs: 1  # Save after each epoch
  resume_from: null

  # Device
  device: "auto"  # auto, cuda, cpu

# Scheduler
scheduler:
  name: "linear" # linear or cosine
  num_warmup_steps: 0

# Evaluation
evaluation:
  eval_on_val: true
  eval_on_test: true
  eval_every_epochs: 1
  write_report: true

# Output
output:
  save_model: true
  save_logs: true
  save_metrics: true
  reports_dir: "artifacts/reports"

# Hardware-aware execution
execution:
  bucketing:
    enabled: false
    batch_size: 8
    mega_batch_mult: 100
    shuffle: true
    drop_last: false
    seed: 42
    length_column: "text_length"
    length_scale: 1.0
  autotuning:
    enabled: false
    warmup_batches: 10
    initial_token_budget: 16384
    min_token_budget: 2048
    max_token_budget: 262144
    memory_headroom_mb: 1024
    scale_up_factor: 1.25
    scale_down_factor: 0.85
    oom_slash_factor: 0.5
    stability_threshold: 0.1
    history_window: 10
    recovery_patience: 5
  dynamic_batching:
    enabled: false
    max_batch_size: 8
    min_batch_size: 1
    drop_last: false
    shuffle: true
    seed: 42
    length_column: "text_length"
    length_scale: 1.0
  telemetry:
    enabled: false
    sample_every: 50
    synchronize: false
  data_loader:
    num_workers: 0
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 2
