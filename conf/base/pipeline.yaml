# conf/base/pipeline.yaml - Base configuration (shared across all environments)

seed: 42

gliner:
  model: "urchade/gliner_large-v2.1"
  confidence_threshold: 0.85
  batch_size: 32
  device: "auto"  # "auto" | "cpu" | "cuda" (explicit authority)
  taxonomy_path: "conf/base/gliner_taxonomy.yaml"
  compute_explicit_recall: true
  explicit_recall_threshold: 0.95

encoder:
  model: "roberta-base"
  hidden_dim: 768
  max_length: 512
  batch_size: 32
  device: "auto"  # "auto" | "cpu" | "cuda"

paths:
  raw_data: "${oc.env:SOBR_DATA_PATH,./datasets}"
  output: "./artifacts"

dataloader:
  batch_size: 32
  num_workers: 4
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true

execution:
  enable_cuda_graphs: false
  enable_torch_compile: false
  numa_pinning: false

precision:
  dtype: "float32"
  use_grad_scaler: false

probe:
  compute_amnesic_drop: true
  amnesic_drop_threshold: 0.30
  train_split: 0.8
  max_samples: 20000

leace:
  force_cpu: false
  regularization: 1e-5
  batch_size: 100

quality:
  enforce_thresholds: false

subset:
  enabled: false
  size: null

logging:
  level: "INFO"
  wandb_enabled: false
