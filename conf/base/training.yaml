# conf/base/training.yaml - Base training configuration

model:
  name: "roberta-base"
  num_labels: 8  # Number of demographic categories
  dropout: 0.1

optimizer:
  name: "adamw"
  lr: 2e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1e-8

scheduler:
  name: "linear"
  num_warmup_steps: 500
  num_training_steps: 10000

training:
  num_epochs: 3
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  eval_steps: 500
  save_steps: 1000
  logging_steps: 100

early_stopping:
  enabled: true
  patience: 3
  metric: "eval_loss"
  mode: "min"
