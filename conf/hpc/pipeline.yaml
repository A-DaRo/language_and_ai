# conf/hpc/pipeline.yaml - HPC-specific overrides (A100/H100)
# Optimized for high-VRAM datacenter GPUs (40-80GB)

defaults:
  - /base/pipeline

# ---------------------------------------------------------------------------
# HPC Advanced Execution Optimizations
# ---------------------------------------------------------------------------
# Full optimization suite enabled for datacenter GPUs with ample VRAM.
# These settings maximize throughput on A100/H100 class hardware.
# ---------------------------------------------------------------------------
execution:
  # CUDA graphs: enabled for static-shape inference (significant speedup)
  enable_cuda_graphs: true
  cuda_graph_warmup: 3
  cuda_graph_cache_size: 32  # More cache for HPC workloads
  
  # torch.compile: enabled with reduce-overhead mode
  enable_torch_compile: true
  torch_compile_mode: "reduce-overhead"
  torch_compile_fullgraph: false
  torch_compile_dynamic: false
  torch_compile_backend: "inductor"
  
  # Sequence packing: enabled for zero-padding inference
  # Concatenates sentences with block-diagonal attention masks
  sequence_packing:
    enabled: true
    max_packed_length: 4096   # Higher limit for high-VRAM GPUs
    min_sequences_to_pack: 2
    use_block_diagonal_mask: true
    pack_by_similarity: true
  
  # Async prefetch: enabled with multiprocessing for HPC
  # Multiple workers for aggressive prefetching
  async_prefetch:
    enabled: true
    queue_size: 8             # Larger queue for HPC throughput
    num_workers: 2            # Multiple prefetch workers
    timeout_seconds: 60.0
    prefetch_factor: 4
    use_multiprocessing: true
    pin_memory: true
    profile_aware: true
  
  # GPU span filtering: enabled with high capacity
  gpu_span_filter:
    enabled: true
    max_spans_per_sequence: 200
    use_topk: false
    topk_k: 100
  
  numa_pinning: true

dataloader:
  batch_size: 256
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true

precision:
  dtype: "bfloat16"
  use_grad_scaler: false

gliner:
  model: "knowledgator/gliner-bi-llama-v1.0"
  batch_size: 32
  device: "cuda"
  require_bi_encoder: true   # Enforce bi-encoder usage
  # ---------------------------------------------------------------------------
  # HPC-optimized Batch Inference Settings
  # ---------------------------------------------------------------------------
  # Aggressive settings for high-VRAM environments (A100/H100).
  # More buckets = finer length grouping = less padding waste.
  # Large batch sizes maximize GPU utilization.
  # ---------------------------------------------------------------------------
  batch_inference:
    enable_batching: true
    # 8 buckets for balanced bucketing on mid-VRAM GPUs (e.g., L4)
    num_buckets: 8
    min_bucket_size: 8  # Larger min size since we have more samples
    enable_prompt_caching: true
  
  chunking:
    mode: "single_sentence"
    legacy_sequential_mode: false
    parallel_chunking_workers: 16
    # Batched parallel processing: send large batches per worker
    # 0 = auto-compute (total_docs // num_workers)
    batch_size_per_worker: 0

subset:
  enabled: false

logging:
  level: "INFO"
  wandb_enabled: true
