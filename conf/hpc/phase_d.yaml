# Phase D Training Configuration (HPC Overrides)

training:
  num_epochs: 10
  batch_size: 32
  learning_rate: 3e-5
  layerwise_lr_decay: 0.9
  gradient_accumulation_steps: 2
  precision: "bf16"
  max_steps: null
  resume_from: null
  early_stopping:
    enabled: true
    patience: 2
    min_delta: 0.0
    metric: "f1_macro"

scheduler:
  name: "cosine"
  num_warmup_steps: 500

execution:
  bucketing:
    enabled: true
    batch_size: 32
    mega_batch_mult: 100
    shuffle: true
    drop_last: false
    seed: 42
    length_column: "token_count"
    length_scale: 1.0
  autotuning:
    enabled: true
    warmup_batches: 10
    initial_token_budget: 65536
    min_token_budget: 8192
    max_token_budget: 393216
    memory_headroom_mb: 2048
    scale_up_factor: 1.25
    scale_down_factor: 0.85
    oom_slash_factor: 0.5
    stability_threshold: 0.1
    history_window: 10
    recovery_patience: 5
  dynamic_batching:
    enabled: false
    max_batch_size: 128
    min_batch_size: 32
    drop_last: false
    shuffle: true
    seed: 42
    length_column: "text_length"
    length_scale: 1.0
  telemetry:
    enabled: true
    sample_every: 50
    synchronize: false
  data_loader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
